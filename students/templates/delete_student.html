<!DOCTYPE html>
<html>

<head>

<title>Delete Student</title>

</head>


<body>


<h1>
Delete Student
</h1>


<p>
Are you sure you want to delete 
<b>{{student.name}}</b>?
</p>



<form method="POST">

{% csrf_token %}


<button type="submit">
Yes, Delete
</button>


</form>


<a href="{% url 'student_detail' student.id %}">
Cancel
</a>


</body>

</html>
